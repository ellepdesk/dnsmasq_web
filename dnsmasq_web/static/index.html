<!doctype html>
<html lang="en" data-bs-theme="auto">
  <head>
    <link rel="stylesheet" href="static/bootstrap.min.css">
    <link rel="stylesheet" href="static/bootstrap-table.min.css">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="List of current leases of Dnsmasq">
    <meta name="author" content="Pelle van der Heide">
    <title>Leases</title>
  </head>
  <body>


<div class="col-lg-8 mx-auto p-4 py-md-5">
  <header class="d-flex align-items-center pb-3 mb-5 border-bottom">
    <a href="/" class="d-flex align-items-center text-body-emphasis text-decoration-none">
      <svg class="bi me-2" width="40" height="32"><use xlink:href="#bootstrap"/></svg>
      <span class="fs-4">Dnsmasq info pages</span>
      <img src="static/icon.png">
    </a>
  </header>

  <main>
    <h1 class="text-body-emphasis">Dnsmasq Leases</h1>
    <p class="fs-5 col-md-8">Currently issued leases</p>

    <table
      id="table"
      data-toggle="table"
      data-url="leases">
      <thead>
        <tr>
          <th data-sortable="true" data-field="ip">IP address</th>
          <th data-sortable="true" data-field="open_ports" data-formatter="PortFormatter">Port</th>
          <th data-sortable="true" data-field="name">Name</th>
          <th data-sortable="true" data-field="mac">MAC address</th>
          <th data-sortable="true" data-field="expires">Expires</th>
          <!-- <th data-sortable="true" data-field="clientid">Client ID</th> -->
        </tr>
      </thead>
    </table>

    <hr class="col-3 col-md-2 mb-5">
  </main>

  <footer class="pt-5 my-5 text-body-secondary border-top">
    Created by ellepdesk - 2024
  </footer>
</div>

<script>
  function PortFormatter(value, row, index) {
  r = ""
  for (v of value) {
    if (v == 22){
      r += "<a href='ssh://"+row.ip+"'>ssh</a>";
    }
   if (v == 80){
      r += "<a href='http://"+row.ip+"'>http</a>";
    }
   if (v == 443){
      r += "<a href='https://"+row.ip+"'>https</a>";
    }
  }
  return r
}

</script>

<script src="static/jquery-3.7.1.min.js"></script>
<script src="static/bootstrap.bundle.min.js"></script>
<script src="static/bootstrap-table.min.js"></script>

</body>
</html>
